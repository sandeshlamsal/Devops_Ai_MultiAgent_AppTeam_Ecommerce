services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 5

  agents:
    build:
      context: .
      dockerfile: Dockerfile.agents
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - workspace:/app/workspace
      # Mount host Claude Code credentials so agents run under your Pro plan
      # No API key or separate billing needed
      - $HOME/.claude:/root/.claude:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure

volumes:
  redis_data:
  postgres_data:
  workspace:
